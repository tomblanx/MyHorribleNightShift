[package]
name = "my_horrible_night_shift"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"



# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
